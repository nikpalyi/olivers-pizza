# Automatikus tartalomfrissites.
#
# Ha barki feltolt vagy torol egy fajlt a content/uploads vagy content/oldal
# mappaban (akar a github.com feluleten keresztul is), ez a folyamat lefuttatja
# a scripts/update-content.js scriptet, es visszacommitolja a generalt
# adatfajlokat. Igy a weboldal magatol frissul, Terminal nelkul.

name: Tartalom frissítése

on:
  push:
    branches: [main]
    paths:
      - 'content/uploads/**'
      - 'content/oldal/**'
      - 'scripts/update-content.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tartalom-frissites
  cancel-in-progress: false

jobs:
  frissites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Adatfájlok újragenerálása
        run: node scripts/update-content.js

      - name: Változások visszacommitolása
        run: |
          if [ -z "$(git status --porcelain content/gallery-data.js content/logos-data.js content/site-data.js)" ]; then
            echo "Nincs valtozas, nincs mit commitolni."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/gallery-data.js content/logos-data.js content/site-data.js
          git commit -m "Galéria, logók és fővideó frissítése"
          git push
